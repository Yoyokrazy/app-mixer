name: Release

on:
  # Every merge to main is a release candidate. Bursts of merges are debounced into one release, and
  # merges that are only docs/test/ci/chore/style don't release at all (see scripts/next-version.sh).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release without the leading "v" (e.g. 0.2.0). Leave empty to derive it from the commits since the last release.
        required: false
        type: string
      runner:
        description: macOS runner (the build is universal; use Intel if arm64 runners are backed up)
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-26-intel

permissions:
  contents: write

jobs:
  # Each push cancels the previous push's wait, so the release only starts once main has been quiet for
  # RELEASE_DEBOUNCE_MINUTES (repo variable, default 10) and then ships everything merged in that burst.
  debounce:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-debounce
      cancel-in-progress: true
    steps:
      - name: Wait for merges to settle
        env:
          MINUTES: ${{ vars.RELEASE_DEBOUNCE_MINUTES || '10' }}
        run: sleep $((MINUTES * 60))

  release:
    needs: debounce
    if: ${{ !cancelled() && (needs.debounce.result == 'success' || needs.debounce.result == 'skipped') }}
    # Pushes default to Intel because hosted arm64 runners have been capacity constrained; the build is universal.
    runs-on: ${{ inputs.runner || vars.RELEASE_RUNNER || 'macos-26-intel' }}
    # One publish at a time and never cancelled mid-flight, so a release can't be left half-made. While one
    # runs, at most one more waits; a newer waiting run replaces an older one.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      APP: build/Build/Products/Release/AppMixer.app
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The version is decided here, inside the serialized job, so two runs can never pick the same one.
      - name: Decide version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          skip() {
            echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          }

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            if [[ "$head" != "$GITHUB_SHA" ]]; then
              skip "main has moved on to ${head:0:7}; that push's run will release it."
            fi
            version=$(scripts/next-version.sh)
            [[ -n "$version" ]] || skip "Nothing to release: no user-facing commits since the last release."
          else
            version=${INPUT_VERSION:-$(scripts/next-version.sh --force)}
            if [[ -z "$version" ]]; then
              echo "::error::Nothing to release: no commits since the last release."
              exit 1
            fi
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$version')"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "Releasing v$version" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        if: env.SKIP != 'true'
        run: brew install xcodegen

      # Ad-hoc signed: CI has no signing certificate. Fine for local installs, but not notarized.
      - name: Build
        if: env.SKIP != 'true'
        run: |
          make build XCODEBUILD_FLAGS="MARKETING_VERSION=$VERSION CURRENT_PROJECT_VERSION=$BUILD_NUMBER CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM="

      - name: Verify and package
        if: env.SKIP != 'true'
        run: |
          codesign --verify --strict "$APP"
          built=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          if [[ "$built" != "$VERSION" ]]; then
            echo "::error::Built version $built does not match $VERSION"
            exit 1
          fi
          ditto -c -k --norsrc --noextattr --keepParent "$APP" AppMixer.zip
          shasum -a 256 AppMixer.zip

      - name: Write release notes
        if: env.SKIP != 'true'
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          readme="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY#readme"
          {
            echo "## Install"
            echo
            echo "Requires macOS 15 or later (Apple silicon or Intel). The same commands upgrade an existing install."
            echo
            echo '```sh'
            echo "gh release download $TAG -R $GITHUB_REPOSITORY -p AppMixer.zip -O /tmp/AppMixer.zip --clobber"
            echo "osascript -e 'tell application id \"com.yoyokrazy.AppMixer\" to quit' 2>/dev/null"
            echo "rm -rf /Applications/AppMixer.app && ditto -x -k /tmp/AppMixer.zip /Applications"
            echo "open /Applications/AppMixer.app"
            echo '```'
            echo
            echo "## First launch"
            echo
            echo "- This build is ad-hoc signed and not notarized. If you downloaded the zip in a browser, clear the quarantine first: \`xattr -dr com.apple.quarantine /Applications/AppMixer.app\`."
            echo "- Grant **System Audio Recording** when asked (System Settings → Privacy & Security → Screen & System Audio Recording)."
            echo "- macOS treats each ad-hoc build as a new app, so it asks again after upgrading. To keep the permission, sign with your own certificate before launching: \`codesign --force --sign \"<your identity>\" /Applications/AppMixer.app\`. See [the README]($readme) for details."
            echo
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s' ${previous:+$previous..}HEAD
          } > notes.md
          cat notes.md

      - name: Publish release
        if: env.SKIP != 'true'
        run: |
          gh release create "$TAG" AppMixer.zip \
            --target "$GITHUB_SHA" \
            --title "App Mixer $VERSION" \
            --notes-file notes.md
